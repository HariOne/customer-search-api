spring:
  profiles:
    active: prod

server:
  port: 8080

logging:
  level:
    root: WARN
    com.company.customersearch: INFO
  file:
    name: /var/log/customer-search-api.log
    max-size: 10MB
    max-history: 30
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %mdc %-5level %logger{36} - %msg%n'

external:
  api:
    base-url: https://api.company.com
