spring:
  profiles:
    active: prod

server:
  port: 8080

third-party-api:
  url: https://api.production.com/customers/search
  timeout-seconds: 30
  max-retries: 5
  retry-delay-millis: 2000

logging:
  level:
    root: WARN
    com.company.customersearch: INFO
    org.springframework.web: WARN
  file:
    name: logs/customer-search-api.log
    max-size: 10MB
    max-history: 30
