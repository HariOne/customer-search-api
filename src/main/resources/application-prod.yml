server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

external-api:
  base-url: https://api.thirdparty.com
  endpoints:
    customers-search: /v1/customers/search
  timeout-ms: 10000
  retry:
    max-attempts: 5
    delay-ms: 2000
    multiplier: 1.5

logging:
  level:
    root: WARN
    com.company.customersearch: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,liveness,readiness
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
